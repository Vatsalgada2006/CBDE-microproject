{% extends "base.html" %}
{% block content %}
<div x-data="uploadComponent()" class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Upload Document</h1>
        <p class="text-gray-500 text-sm mt-1">Add files to your workspace for intelligent processing.</p>
    </div>

    <!-- Drag & Drop Zone -->
    <div 
        @dragover.prevent="dragover = true"
        @dragleave.prevent="dragover = false"
        @drop.prevent="handleDrop"
        :class="{ 'border-primary bg-primary/5': dragover, 'border-gray-300 bg-white hover:bg-gray-50': !dragover }"
        class="relative flex justify-center px-6 pt-12 pb-16 border-2 border-dashed rounded-xl transition-colors mb-6"
    >
        <div class="space-y-4 text-center">
            <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto text-primary text-2xl">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <div class="flex text-sm text-gray-600 justify-center">
                <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-primary hover:text-primary-hover focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-primary">
                    <span>Upload a file</span>
                    <input id="file-upload" name="file-upload" type="file" class="sr-only" @change="handleFileSelect" multiple>
                </label>
                <p class="pl-1">or drag and drop</p>
            </div>
            <p class="text-xs text-gray-500">
                PDF, DOCX, XLSX, TXT, PNG, JPG up to 10MB
            </p>
        </div>
    </div>

    <!-- Selected Files List -->
    <div x-show="files.length > 0" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6" style="display: none;">
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
            <h3 class="font-semibold text-gray-800">Files to Upload (<span x-text="files.length"></span>)</h3>
            <button @click="uploadAll" :disabled="uploading" class="bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-upload mr-2"></i> <span x-text="uploading ? 'Uploading...' : 'Upload All'"></span>
            </button>
        </div>
        <ul role="list" class="divide-y divide-gray-100">
            <template x-for="(file, index) in files" :key="index">
                <li class="px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center flex-1 min-w-0">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center text-lg shrink-0" :class="getFileIconColor(file.name)">
                            <i :class="getFileIcon(file.name)"></i>
                        </div>
                        <div class="ml-4 flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate" x-text="file.name"></p>
                            <p class="text-xs text-gray-500" x-text="formatSize(file.size)"></p>
                            
                            <!-- Progress Bar -->
                            <div x-show="file.uploading || file.completed" class="mt-2 w-full bg-gray-100 rounded-full h-1.5 relative overflow-hidden" style="display: none;">
                                <div class="bg-primary h-1.5 rounded-full transition-all duration-300" :class="{ 'bg-emerald-500': file.completed, 'bg-red-500': file.error }" :style="'width: ' + file.progress + '%'"></div>
                            </div>
                            <p x-show="file.error" class="text-xs text-red-500 mt-1" x-text="file.errorMessage" style="display: none;"></p>
                        </div>
                    </div>
                    <div class="ml-4 shrink-0 flex items-center gap-2">
                        <span x-show="file.completed" class="text-emerald-500" style="display: none;"><i class="fas fa-check-circle"></i></span>
                        <button @click="removeFile(index)" x-show="!file.uploading && !file.completed" class="text-gray-400 hover:text-red-500 transition-colors p-1 rounded">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </li>
            </template>
        </ul>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('uploadComponent', () => ({
        dragover: false,
        files: [],
        uploading: false,

        handleDrop(e) {
            this.dragover = false;
            const droppedFiles = e.dataTransfer.files;
            if (droppedFiles.length) {
                this.addFiles(Array.from(droppedFiles));
            }
        },

        handleFileSelect(e) {
            const selectedFiles = e.target.files;
            if (selectedFiles.length) {
                this.addFiles(Array.from(selectedFiles));
            }
            e.target.value = ''; // Reset input
        },

        addFiles(newFiles) {
            newFiles.forEach(file => {
                this.files.push({
                    file: file,
                    name: file.name,
                    size: file.size,
                    progress: 0,
                    uploading: false,
                    completed: false,
                    error: false,
                    errorMessage: ''
                });
            });
        },

        removeFile(index) {
            this.files.splice(index, 1);
        },

        async uploadAll() {
            if (this.files.length === 0 || this.uploading) return;
            this.uploading = true;
            
            const pendingFiles = this.files.filter(f => !f.completed && !f.error);
            
            for (let f of pendingFiles) {
                f.uploading = true;
                f.error = false;
                
                // Simulate progress for UI feedback while waiting for actual upload
                let progressInterval = setInterval(() => {
                    if (f.progress < 85) f.progress += Math.random() * 15;
                }, 300);

                try {
                    const formData = new FormData();
                    formData.append('file', f.file);
                    
                    // We must wait for auth state
                    const token = window.getAuthToken();
                    
                    const response = await fetch('/documents/upload', {
                        method: 'POST',
                        headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                        body: formData
                    });
                    
                    clearInterval(progressInterval);
                    f.progress = 100;
                    f.uploading = false;
                    
                    if (response.ok) {
                        f.completed = true;
                        window.showToast(`${f.name} uploaded successfully`, 'success');
                    } else {
                        const data = await response.json();
                        f.error = true;
                        f.errorMessage = data.error || 'Upload failed';
                        window.showToast(f.errorMessage, 'error');
                    }
                } catch (err) {
                    clearInterval(progressInterval);
                    f.uploading = false;
                    f.error = true;
                    f.progress = 100;
                    f.errorMessage = err.message || 'Upload failed';
                    window.showToast(f.errorMessage, 'error');
                }
            }
            
            this.uploading = false;
            
            // If all successful, redirect to documents view after a short delay
            if (this.files.every(f => f.completed)) {
                setTimeout(() => {
                    window.location.href = '/documents/view';
                }, 1500);
            }
        },

        formatSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        },

        getFileIcon(name) {
            name = (name || '').toLowerCase();
            if (name.endsWith('.pdf')) return 'fas fa-file-pdf';
            if (name.endsWith('.doc') || name.endsWith('.docx')) return 'fas fa-file-word';
            if (name.endsWith('.xls') || name.endsWith('.xlsx')) return 'fas fa-file-excel';
            if (name.endsWith('.jpg') || name.endsWith('.png')) return 'fas fa-file-image';
            if (name.endsWith('.ppt') || name.endsWith('.pptx')) return 'fas fa-file-powerpoint';
            return 'fas fa-file-alt';
        },

        getFileIconColor(name) {
            name = (name || '').toLowerCase();
            if (name.endsWith('.pdf')) return 'bg-red-50 text-red-500';
            if (name.endsWith('.doc') || name.endsWith('.docx')) return 'bg-blue-50 text-blue-500';
            if (name.endsWith('.xls') || name.endsWith('.xlsx')) return 'bg-emerald-50 text-emerald-500';
            if (name.endsWith('.jpg') || name.endsWith('.png')) return 'bg-purple-50 text-purple-500';
            if (name.endsWith('.ppt') || name.endsWith('.pptx')) return 'bg-orange-50 text-orange-500';
            return 'bg-gray-100 text-gray-500';
        }
    }));
});
</script>
{% endblock %}
