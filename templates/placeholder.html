{% extends "base.html" %}
{% block content %}
<div class="h-full flex flex-col items-center justify-center text-center p-8">
    <div class="w-20 h-20 bg-indigo-50 text-primary rounded-full flex items-center justify-center text-3xl mb-6 shadow-sm border border-indigo-100">
        <i class="{{ icon|default('fas fa-hammer') }}"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">{{ title }}</h1>
    <p class="text-gray-500 max-w-md mx-auto mb-8">{{ description }}</p>
    <a href="/" class="bg-white border border-gray-300 text-gray-700 px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors shadow-sm">
        Return to Dashboard
    </a>
</div>
{% endblock %}
