{% extends "base.html" %}
{% block content %}
<div x-data="documentsView()" x-init="initData()" class="h-full flex flex-col">
    <!-- Header & Toolbar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Documents</h1>
            <p class="text-gray-500 text-sm mt-1">Manage and organize your intelligent document collection.</p>
        </div>
        
        <div class="flex items-center gap-3">
            <div class="relative">
                <input type="text" x-model="searchQuery" @input.debounce.300ms="fetchDocuments()" class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="Filter documents...">
                <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
            </div>
            
            <a href="/upload" class="bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center gap-2">
                <i class="fas fa-plus"></i> New
            </a>
        </div>
    </div>

    <!-- Active Filters -->
    <div x-show="searchQuery" class="mb-4 flex items-center gap-2" style="display: none;">
        <span class="text-sm text-gray-500">Showing results for:</span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-primary/10 text-primary">
            <span x-text="searchQuery"></span>
            <button @click="searchQuery = ''; fetchDocuments()"><i class="fas fa-times hover:text-primary-hover"></i></button>
        </span>
    </div>

    <!-- Document Grid/List -->
    <div class="flex-1 overflow-auto bg-white border border-gray-200 rounded-xl shadow-sm relative">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/2">Name</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Size</th>
                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Uploaded</th>
                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-100 relative">
                <!-- Loading State -->
                <tr x-show="loading">
                    <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                        <i class="fas fa-spinner fa-spin text-primary text-2xl mb-3"></i>
                        <p class="font-medium">Loading documents...</p>
                    </td>
                </tr>
                
                <!-- Empty State -->
                <tr x-show="!loading && documents.length === 0" style="display: none;">
                    <td colspan="6" class="px-6 py-16 text-center">
                        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400 text-3xl">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <h3 class="text-gray-900 font-medium text-lg mb-1" x-text="searchQuery ? 'No matching documents' : 'No documents yet'"></h3>
                        <p class="text-gray-500 text-sm mb-6" x-text="searchQuery ? 'Try adjusting your filters' : 'Upload your first document to get started.'"></p>
                        <a x-show="!searchQuery" href="/upload" class="inline-flex items-center gap-2 bg-primary text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-primary-hover transition-colors">
                            <i class="fas fa-upload"></i> Upload Document
                        </a>
                    </td>
                </tr>

                <!-- Documents List -->
                <template x-for="doc in documents" :key="doc.id">
                    <tr class="hover:bg-gray-50 group transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap cursor-pointer" @click="window.location.href='/documents/view/' + doc.id">
                            <div class="flex items-center">
                                <div class="w-10 h-10 shrink-0 rounded-lg flex items-center justify-center text-lg bg-gray-100" :class="getFileIconColor(doc.filename)">
                                    <i :class="getFileIcon(doc.filename)"></i>
                                </div>
                                <div class="ml-4 max-w-[240px] lg:max-w-md">
                                    <div class="text-sm font-medium text-gray-900 truncate" x-text="doc.filename"></div>
                                    <div class="text-xs text-gray-500 mt-0.5 truncate" x-text="doc.title || 'Untitled'"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span x-show="doc.processing_status === 'completed'" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-200">
                                <i class="fas fa-check-circle"></i> Analyzed
                            </span>
                            <span x-show="doc.processing_status === 'pending' || doc.processing_status === 'extracting'" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200">
                                <i class="fas fa-spinner fa-spin"></i> Processing
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="text-sm text-gray-600 capitalize" x-text="doc.document_type || 'Unknown'"></span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600" x-text="formatSize(doc.file_size)"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm text-gray-500" x-text="formatDate(doc.CreatedAt)"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <a :href="'/documents/view/' + doc.id" class="p-2 text-gray-400 hover:text-primary hover:bg-primary/10 rounded-lg transition-colors" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <button @click="deleteDocument(doc.id)" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('documentsView', () => ({
        documents: [],
        loading: true,
        searchQuery: '',
        
        async initData() {
            await this.fetchDocuments();
        },
        
        async fetchDocuments() {
            this.loading = true;
            try {
                let url = '/documents';
                if (this.searchQuery) {
                    url += '?search=' + encodeURIComponent(this.searchQuery);
                }
                const res = await window.authenticatedFetch(url);
                if (res.ok) {
                    const data = await res.json();
                    this.documents = data.documents || [];
                }
            } catch (e) {
                console.error('Failed to fetch documents', e);
                window.showToast('Failed to load documents.', 'error');
            } finally {
                this.loading = false;
            }
        },

        async deleteDocument(id) {
            if (!confirm("Are you sure you want to delete this document?")) return;
            try {
                const res = await window.authenticatedFetch('/documents/' + id, { method: 'DELETE' });
                if (res.ok) {
                    this.documents = this.documents.filter(d => d.id !== id);
                    window.showToast('Document deleted.', 'success');
                } else {
                    window.showToast('Failed to delete document.', 'error');
                }
            } catch (e) {
                window.showToast('Error deleting document.', 'error');
            }
        },
        
        formatSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        },
        
        formatDate(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        },
        
        getFileIcon(name) {
            name = (name || '').toLowerCase();
            if (name.endsWith('.pdf')) return 'fas fa-file-pdf';
            if (name.endsWith('.doc') || name.endsWith('.docx')) return 'fas fa-file-word';
            if (name.endsWith('.xls') || name.endsWith('.xlsx')) return 'fas fa-file-excel';
            if (name.endsWith('.jpg') || name.endsWith('.png')) return 'fas fa-file-image';
            if (name.endsWith('.ppt') || name.endsWith('.pptx')) return 'fas fa-file-powerpoint';
            return 'fas fa-file-alt';
        },
        
        getFileIconColor(name) {
            name = (name || '').toLowerCase();
            if (name.endsWith('.pdf')) return 'bg-red-50 text-red-500';
            if (name.endsWith('.doc') || name.endsWith('.docx')) return 'bg-blue-50 text-blue-500';
            if (name.endsWith('.xls') || name.endsWith('.xlsx')) return 'bg-emerald-50 text-emerald-500';
            if (name.endsWith('.jpg') || name.endsWith('.png')) return 'bg-purple-50 text-purple-500';
            if (name.endsWith('.ppt') || name.endsWith('.pptx')) return 'bg-orange-50 text-orange-500';
            return 'bg-gray-100 text-gray-500';
        }
    }));
});
</script>
{% endblock %}
